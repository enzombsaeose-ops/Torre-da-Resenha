<style>html,body{margin:0;height:100%;background:#0e0b1a;overflow:hidden}html,body{overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}#sa{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}</style>
</head><body><canvas id="c"></canvas><div id="sa"></div>
<script>
"use strict";
/* ===== js/config.js — tudo balanceável fica aqui ===== */
const CFG = {
  step: 1/120, maxFrame: 0.1, viewH: 700,
  walk: 230, sprint: 350,
  groundAccel: 2400, groundDecel: 2800, turnGround: 4200,
  airAccel: 1800, airDecel: 900, turnAir: 2600,
  gravity: 1900, cutMult: 2.6, maxFall: 850,
  jump: 640, coyote: 0.10, buffer: 0.12,
  wallSlide: 90, wallJumpX: 360, wallJumpY: 600, wallLock: 0.16, lockControl: 0.35, wallCoyote: 0.08,
  player: { w: 22, h: 32 }, hearts: 3, invul: 3, knock: { vx: 300, vy: -420, lock: .25 }, lavaWarn: 260, // Etapa 5: corações, invulnerabilidade (s), distância do aviso de lava (px)
  keys: { left:['KeyA','ArrowLeft'], right:['KeyD','ArrowRight'], jump:['Space'], sprint:['ShiftLeft','ShiftRight'],
          push:['KeyE'], pause:['Escape'], debug:['F3','KeyH'],
          newTower:['KeyN'], ph1:['Digit1'], ph2:['Digit2'], ph3:['Digit3'], ph4:['Digit4'], ph5:['Digit5'] }
};

const SA = { t: 0, r: 0, b: 0, l: 0 }; // áreas seguras (recortes/barras do sistema), lidas do CSS env()
function readSA() { if (typeof getComputedStyle !== 'function') return; const c = getComputedStyle(document.getElementById('sa')); SA.t = parseFloat(c.paddingTop) || 0; SA.r = parseFloat(c.paddingRight) || 0; SA.b = parseFloat(c.paddingBottom) || 0; SA.l = parseFloat(c.paddingLeft) || 0; }
/* ===== core/InputManager.js ===== */
const Input = (() => {
  const down = new Set(), pressed = new Set(), map = {}, tdown = new Set(), ptrs = new Map();
  let touchMode = matchMedia('(pointer:coarse)').matches;
  for (const a in CFG.keys) for (const k of CFG.keys[a]) map[k] = a;
  addEventListener('keydown', e => {
    const a = map[e.code]; if (!a) return;
    e.preventDefault(); if (!down.has(a)) pressed.add(a); down.add(a);
  });
  addEventListener('keyup', e => { const a = map[e.code]; if (a) down.delete(a); });
  addEventListener('blur', () => down.clear());
  /* controles de toque (principal no celular); o teclado continua funcionando */
  function layout() { // retrato: esquerda = direção; direita = PULAR grande, com EMPURRAR e CORRER na fileira acima
    const w = innerWidth, h = innerHeight, s = Math.max(60, Math.min(88, Math.min(w, h) * 0.19)), g = s * 0.18, J = s * 1.3;
    const ml = Math.max(16, w * 0.04) + SA.l, mr = Math.max(16, w * 0.04) + SA.r, by = Math.max(28, h * 0.05) + SA.b, ty = Math.max(12, h * 0.02) + SA.t;
    const jy = h - by - J, r2 = jy - s - g, q = s * 0.5;
    return [
      { a:'left',   x:ml,            y:h-by-s, w:s, h:s, t:'◀' }, { a:'right', x:ml+s+g, y:h-by-s, w:s, h:s, t:'▶' },
      { a:'jump',   x:w-mr-J,        y:jy,     w:J, h:J, t:'PULAR' },
      { a:'sprint', x:w-mr-s,        y:r2,     w:s, h:s, t:'CORRER' }, { a:'push', x:w-mr-2*s-g, y:r2, w:s, h:s, t:'EMPURRAR' },
      { a:'menu', x:w-mr-q, y:ty, w:q, h:q, t:'☰' }
    ];
  }
  function sync() {
    const n = new Set(), L = layout();
    for (const q of ptrs.values()) for (const b of L)
      if (q.x >= b.x-8 && q.x <= b.x+b.w+8 && q.y >= b.y-8 && q.y <= b.y+b.h+8) n.add(b.a);
    for (const a of n) if (!tdown.has(a)) pressed.add(a);
    tdown.clear(); n.forEach(a => tdown.add(a));
  }
  addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') touchMode = true; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); sync(); });
  addEventListener('pointermove', e => { if (ptrs.has(e.pointerId)) { ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); sync(); } });
  for (const t of ['pointerup', 'pointercancel']) addEventListener(t, e => { ptrs.delete(e.pointerId); sync(); });
  addEventListener('contextmenu', e => e.preventDefault());
  for (const t of ['touchstart', 'touchmove']) addEventListener(t, e => e.preventDefault(), { passive: false }); // sem rolagem/zoom/gestos do navegador
  for (const t of ['gesturestart', 'gesturechange', 'dblclick']) addEventListener(t, e => e.preventDefault());
  return { down: a => down.has(a) || tdown.has(a), pressed: a => pressed.has(a), endStep: () => pressed.clear(),
           layout, isTouch: () => touchMode };
})();

/* ===== Level: torre em andares (dados). Coordenadas do mundo em px, y cresce para baixo =====
   Cada andar tem altura FH. Plataforma: [x, altura acima do piso do andar, largura].
   Parede: [x, de, até, largura] (alturas acima do piso do andar). O último andar contém a meta. */
const Level = (() => {
  const W = 900, H = 2400, FH = 300, BASE = 2300, s = [];
  const add = (x,y,w,h,kind='plat') => s.push({x,y,w,h,kind});
  const FLOORS = [
    { plats: [[120,70,160],[340,140,160],[560,210,160],[350,280,160]] },                 // 1: escada de saltos
    { plats: [[120,50,160],[300,120,220]], walls: [[300,180,300,40],[480,180,300,40]] }, // 2: entrada do poço
    { walls: [[300,0,300,40],[480,0,300,40]] },                                           // 3: poço de salto na parede
    { plats: [[520,160,180],[740,230,120]], walls: [[300,0,140,40],[480,0,140,40]] },     // 4: saída do poço
    { plats: [[520,0,160],[300,70,160],[500,140,160],[260,210,160]], goal: [420,280,200] } // 5: subida final + meta
  ];
  add(0,BASE,W,100,'floor'); add(0,0,40,H,'wall'); add(W-40,0,40,H,'wall');
  FLOORS.forEach((f, i) => {
    const sy = BASE - i * FH;
    (f.plats || []).forEach(([x,up,w]) => add(x, sy - up, w, 20));
    (f.walls || []).forEach(([x,a,b,w]) => add(x, sy - b, w, b - a, 'wall'));
    if (f.goal) add(f.goal[0], sy - f.goal[1], f.goal[2], 20, 'goal');
  });
  const N = FLOORS.length, goal = s.find(r => r.kind === 'goal');
  return { W, H, FH, BASE, N, solids: s, goal, spawn: { x: 160, y: BASE - CFG.player.h },
           floorOf: y => Math.min(Level.N, Math.max(1, Math.floor((Level.BASE - y) / Level.FH) + 1)) };
})();
const ManualData = { FH: Level.FH, solids: Level.solids, goal: Level.goal, N: Level.N, BASE: Level.BASE, H: Level.H, spawn: Level.spawn };
Level.set = function (d) { Object.assign(this, { FH: d.FH, solids: d.solids, goal: d.goal, N: d.N, BASE: d.BASE, H: d.H, spawn: d.spawn, hazards: d.hazards || [], structs: d.structs || [], xMin: d.xMin || 0 }); };

/* ===== entities/Player.js + systems/PlayerSystem.js ===== */
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const hit = (x,y,w,h,S=Level.solids) => S.some(s => !s.off && x < s.x+s.w && x+w > s.x && y < s.y+s.h && y+h > s.y);

function newPlayer() {
  return { x: Level.spawn.x, y: Level.spawn.y, w: CFG.player.w, h: CFG.player.h, vx: 0, vy: 0,
    face: 1, grounded: false, wallDir: 0, wallSide: 0, wallTime: 0, lastJumpWall: 0,
    coyote: 0, buffer: 0, lock: 0, sliding: false, hearts: CFG.hearts, invul: 0, hurtT: 0, state: 'active', cause: null };
}

function stepPlayer(p, dt, inp = Input, S = Level.solids) {
  const ix = (inp.down('right') ? 1 : 0) - (inp.down('left') ? 1 : 0);
  if (ix) p.face = ix;
  // timers (baseados em tempo, não em quadros)
  p.coyote = p.grounded ? CFG.coyote : p.coyote - dt;
  p.buffer = inp.pressed('jump') ? CFG.buffer : p.buffer - dt;
  p.wallTime = p.wallDir ? CFG.wallCoyote : p.wallTime - dt;
  if (p.wallDir) p.wallSide = p.wallDir;
  if (p.grounded) p.lastJumpWall = 0;
  p.lock -= dt;

  // horizontal: andar sempre; sprint enquanto Shift estiver pressionado
  const max = inp.down('sprint') ? CFG.sprint : CFG.walk, g = p.grounded;
  let acc;
  if (!ix) acc = g ? CFG.groundDecel : CFG.airDecel;
  else if (Math.sign(p.vx) === -ix) acc = g ? CFG.turnGround : CFG.turnAir;
  else acc = g ? CFG.groundAccel : CFG.airAccel;
  if (p.lock > 0) acc *= CFG.lockControl;
  p.vx = approach(p.vx, ix * max, acc * dt);

  // pulo (coyote + buffer) e salto na parede
  if (p.buffer > 0) {
    if (p.coyote > 0) { p.vy = -CFG.jump; p.coyote = 0; p.buffer = 0; p.grounded = false; }
    else if (p.wallTime > 0 && p.wallSide !== p.lastJumpWall) {
      p.vx = -p.wallSide * CFG.wallJumpX; p.vy = -CFG.wallJumpY; p.face = -p.wallSide;
      p.lastJumpWall = p.wallSide; p.lock = CFG.wallLock; p.wallTime = 0; p.buffer = 0;
    }
  }

  // gravidade; soltar o pulo corta a subida (altura variável)
  let gr = CFG.gravity;
  if (p.vy < 0 && !inp.down('jump')) gr *= CFG.cutMult;
  p.vy = Math.min(p.vy + gr * dt, CFG.maxFall);
  p.sliding = !p.grounded && p.wallDir !== 0 && p.vy > 0 && ix === p.wallDir;
  if (p.sliding) p.vy = Math.min(p.vy, CFG.wallSlide);

  // colisão por eixo
  p.x += p.vx * dt;
  for (const s of S) if (!s.off && p.x < s.x+s.w && p.x+p.w > s.x && p.y < s.y+s.h && p.y+p.h > s.y) {
    p.x = p.vx > 0 ? s.x - p.w : s.x + s.w; p.vx = 0;
  }
  p.y += p.vy * dt;
  for (const s of S) if (!s.off && p.x < s.x+s.w && p.x+p.w > s.x && p.y < s.y+s.h && p.y+p.h > s.y) {
    p.y = p.vy > 0 ? s.y - p.h : s.y + s.h; p.vy = 0;
  }
  // sondas de contato
  p.grounded = p.vy >= 0 && hit(p.x, p.y + 1, p.w, p.h, S);
  p.wallDir = p.grounded ? 0 : hit(p.x - 1, p.y, p.w, p.h, S) ? -1 : hit(p.x + 1, p.y, p.w, p.h, S) ? 1 : 0;
}

/* ===== procedural/SeededRandom.js ===== */
const GEN_VERSION = 4; // v2: obstáculos (lote 1) entram na geração
function hashStr(str) { let h = 2166136261 >>> 0; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function SeededRandom(seed) {
  let a = hashStr(String(seed)) || 1;
  const next = () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  return { next, int: n => Math.floor(next() * n), chance: p => next() < p };
}

/* ===== procedural/DifficultyManager.js (config das fases) ===== */
CFG.phases = [
  { name: 'Aquecimento',  floors: 6,  maxDiff: 1, obst: { spike: .7, max: 2 } },
  { name: 'Agitação',     floors: 8,  maxDiff: 2, obst: { spike: .75, temp: .4, max: 2, maxPlat: 1 } },
  { name: 'Caos',         floors: 12, maxDiff: 2, obst: { spike: .7, rspike: .4, zombie: .35, spin: .25, temp: .3, crumble: .5, max: 3, maxPlat: 1 } },
  { name: 'Desespero',    floors: 16, maxDiff: 3, obst: { spike: .75, rspike: .5, zombie: .45, spin: .4, temp: .35, crumble: .55, max: 4, maxPlat: 2 } },
  { name: 'Sem Amizade',  floors: 20, maxDiff: 3, obst: { spike: .8, rspike: .55, zombie: .5, spin: .55, temp: .4, crumble: .6, max: 5, maxPlat: 2 } }
];
CFG.gen = { maxTries: 10, shift: 20, // passo do deslocamento horizontal dos modelos
   margin: 42, floorH: 280 }; // altura do andar gerado (degraus ≤ 70px entre andares)

/* ===== procedural/FloorTemplates.js =====
   plats: [x, altura acima do piso do andar, largura]; walls: [x, de, até, largura].
   route = índices das plataformas na ordem de travessia (padrão: todas). Primeira = entrada, última = saída. */
const TEMPLATES = [
  { id: 'escada',   diff: 1, plats: [[100,60,180],[340,130,160],[580,200,160],[700,270,140]] },
  { id: 'largo',    diff: 1, plats: [[60,60,300],[420,130,300],[120,200,300],[460,270,300]] },
  { id: 'estreito', diff: 2, plats: [[200,60,100],[400,130,100],[600,200,100],[420,270,120]] },
  { id: 'poco',     diff: 3, plats: [[300,60,220],[520,280,180]], walls: [[300,120,260,40],[480,120,260,40]] },
  { id: 'zig2',    diff: 2, plats: [[320,60,240],[60,130,220],[320,200,220],[600,270,220]] },
  { id: 'degraus', diff: 2, plats: [[80,60,200],[360,130,200],[640,200,200],[360,270,260]] },
];

/* ===== procedural/Structures.js — estruturas de 2 andares: tamanho (muda a lava) x dificuldade (muda a lava) + tema ===== */
CFG.pxPerM = 20; // 1 metro = 20 px
const SZ = { 'Grande': 1.1, 'Média': 1, 'Pequena': .9 }, DF = { 'Difícil': .92, 'Média': 1, 'Fácil': 1.08 }, lavaMult = s => SZ[s.size] * DF[s.diff];
const STRUCTS = [ // extra: [tipo, chance, largura mínima da plataforma]; obst: pesos que sobrescrevem os da fase; tpls: modelos preferidos
  { id: 'cemiterio', name: 'Cemitério', size: 'Média', diff: 'Fácil', minPhase: 0, tpls: ['escada', 'degraus'], obst: { zombie: .45, spike: .3, rspike: 0, spin: 0 }, extra: [['ghost', .8, 120]] },
  { id: 'floresta', name: 'Floresta dos Macacos', size: 'Média', diff: 'Média', minPhase: 0, tpls: ['zig2', 'largo'], obst: { zombie: 0, spike: .3, rspike: 0, spin: 0 }, extra: [['monkey', .9, 140]] },
  { id: 'corredor', name: 'Corredor Vertical', size: 'Grande', diff: 'Média', minPhase: 1, tpls: ['poco', 'estreito'], obst: { zombie: 0, spike: 0, rspike: .8, spin: 0, temp: 0 }, extra: [] },
  { id: 'oceano', name: 'Inundação Oceânica', size: 'Grande', diff: 'Difícil', minPhase: 2, tpls: ['largo', 'zig2'], obst: { zombie: 0, spike: 0, rspike: 0, spin: 0 }, extra: [['shark', .8, 150], ['eel', .8, 200]] },
  { id: 'fabrica', name: 'Fábrica do Mal', size: 'Média', diff: 'Difícil', minPhase: 2, tpls: ['poco', 'estreito', 'degraus'], obst: { zombie: 0, spike: .3, rspike: .3, spin: .3 }, extra: [['saw', .8, 260], ['piston', .8, 140]] }
];
const STY = { cemiterio: { plat: '#8a8f9c', bg: 'rgba(120,130,160,.14)' }, floresta: { plat: '#8b5a2b', bg: 'rgba(60,140,70,.14)' }, corredor: { plat: '#6a6fd8', bg: 'rgba(110,110,220,.12)' },
  oceano: { plat: '#2fae6b', bg: 'rgba(30,111,168,.24)' }, fabrica: { plat: '#7a828c', bg: 'rgba(200,120,60,.14)' } };
const lavaTier = m => m < 7 ? { t: 'Resenha Quente!', c: '#ff4d3a' } : m < 14 ? { t: 'Resenha Esquentando', c: '#ffb02e' } : m < 28 ? { t: 'Resenha Morna', c: '#ffe08a' } : { t: 'Resenha Fria', c: '#9fe3ff' };
/* obstáculos temáticos (comportamento por tempo de jogo, sem estado: determinísticos) */
function themed(c, rng, st, haz, pi) {
  for (const [type, pr, minW] of st.extra || []) {
    if (!rng.chance(Math.min(.95, pr * (.55 + .15 * pi)))) continue;
    const free = c.route.slice(1).filter(r => r.kind === 'plat' && r.w >= minW && !haz.some(h => h.x < r.x + r.w && h.x + h.w > r.x && Math.abs(h.y + h.h - r.y) < 4));
    if (!free.length) continue;
    const r = free[rng.int(free.length)], cx = r.x + r.w / 2, f0 = rng.next(); let h;
    if (type === 'ghost' || type === 'shark') { const g = type === 'ghost', A = g ? 60 + f0 * 30 : 90 + f0 * 30, B = g ? 26 : 14, cy = r.y - (g ? 64 : 56);
      h = { type, cx, cy, A, B, om: g ? .8 + f0 * .5 : .6 + f0 * .3, ph: f0 * 6.28, hw: g ? 12 : 24, hh: g ? 12 : 11, x: cx - A - 26, y: cy - B - 14, w: 2 * A + 52, h: 2 * B + 28 }; }
    else if (type === 'eel') h = { type, cx, cy: r.y - 14, R: 64, safe: 1.6, warn: .7, on: .7, ret: .3, ph: f0 * 3.3, x: cx - 64, y: r.y - 78, w: 128, h: 128 };
    else if (type === 'monkey') { const L = cx < Level.W / 2, mx = L ? r.x + 8 : r.x + r.w - 32, my = r.y - 26;
      h = { type, mx, my, T: 3 + f0 * 1.2, fl: 2.2, ph: f0 * 4, bvx: (L ? 1 : -1) * (120 + rng.next() * 100), bvy: -420, x: mx - 320, y: my - 140, w: 660, h: 700 }; }
    else if (type === 'saw') { const x0 = r.x + 20, x1 = r.x + r.w - 48; h = { type, x0, x1, x: x0, y: r.y - 28, w: x1 - x0 + 28, h: 28, speed: 55 + f0 * 30, off: rng.next() }; }
    else h = { type: 'piston', x: Math.round(cx - 20), y: r.y - 80, w: 40, h: 80, safe: 1.2, warn: .5, on: .8, ret: .4, ph: f0 * 2.9 };
    haz.push(h);
  }
}

/* ===== core/Sprites.js — SISTEMA DE ARTES v2 (qualquer coisa do jogo pode ter sprite) =====
   PASTA: assets/images/<pasta>/<nome>.png   (player, enemies, obstacles, tiles, effects, ui, backgrounds — "tittles" ou "titles" também valem no lugar de "tiles")
   DOIS TIPOS DE ARTE:
     ANIMADA  = tira horizontal de quadros QUADRADOS lado a lado (nº de quadros = largura ÷ altura). 1 quadro = imagem quadrada (16, 32, 64...). Tamanho no jogo = tamanho do quadro (1 px de arte = 1 px do mundo), a menos que SPR.dim diga outro.
     INTEIRA  = imagem única, de qualquer proporção, esticada no espaço do jogo (ui, backgrounds, barras, partes de pistão...).
   Arquivo ausente = o jogo desenha a forma vetorial antiga (nunca quebra). Nome novo = carregado sozinho na 1ª vez que o código pedir.
   Artes olham para a DIREITA (o jogo espelha ao virar). Painel de conferência: abra index.html?assets */
const SPR = {
  base: 'assets/images/', fps: 8, img: {}, pat: {}, st: {}, url: {}, dbg: new URLSearchParams(location.search).has('assets'),
  alias: { tiles: ['tittles', 'titles'] },                 // pastas alternativas (o repositório do projeto usa "tittles")
  colorSkins: false,                                       // true = tenta player/<cor>/<estado>.png (vermelho, azul, verde, amarelo, roxo) antes de player/<estado>.png
  CN: { '#e63946': 'vermelho', '#3a86ff': 'azul', '#2ecc71': 'verde', '#f2c94c': 'amarelo', '#9b5de5': 'roxo' },
  dim: { /* tamanho de desenho no mundo [largura, altura] — só se a arte tiver resolução maior/menor que o tamanho no jogo. Ex.: 'player/idle': [32, 32] com arte 64x64 */
    'enemies/shark': [64, 64] },
  fpsOf: { 'player/walk': 10, 'player/run': 14, 'obstacles/saw': 16, 'obstacles/flag': 6, 'effects/lava': 4, 'effects/shield': 10 }, // quadros por segundo (padrão: fps)
  PS: ['idle', 'walk', 'run', 'jump', 'fall', 'wall', 'hurt', 'dead', 'push', 'done'],
  files: ['player/idle', 'player/walk', 'player/run', 'player/jump', 'player/fall', 'player/wall', 'player/hurt', 'player/dead', 'player/push', 'player/done',
    'enemies/zombie', 'enemies/ghost', 'enemies/shark', 'enemies/eel', 'enemies/monkey', 'enemies/banana',
    'obstacles/spike', 'obstacles/rspike', 'obstacles/saw', 'obstacles/spin_bar', 'obstacles/spin_hub', 'obstacles/piston_body', 'obstacles/piston_head', 'obstacles/flag',
    'tiles/plat', 'tiles/wall', 'tiles/floor', 'tiles/goal', 'tiles/temp', 'tiles/temp_warn', 'tiles/crumble', 'tiles/crumble_warn',
    'effects/lava', 'effects/lava_body', 'effects/shield', 'effects/hit', 'effects/push',
    'ui/heart_full', 'ui/heart_empty', 'ui/title', 'ui/button', 'ui/button_go', 'ui/btn_left', 'ui/btn_right', 'ui/btn_jump', 'ui/btn_sprint', 'ui/btn_push', 'ui/btn_menu',
    'ui/btn_left_down', 'ui/btn_right_down', 'ui/btn_jump_down', 'ui/btn_sprint_down', 'ui/btn_push_down', 'ui/btn_menu_down',
    'backgrounds/main', 'backgrounds/menu'],
  load() { const ids = [...STRUCTS, ...(typeof DRAWN === 'undefined' ? [] : DRAWN)].map(s => s.id); // estrutura nova ganha arte só pelo nome (id)
    for (const i of ids) this.files.push('tiles/' + i + '_plat', 'tiles/' + i + '_wall', 'backgrounds/' + i);

    const nx = App.manual ? 'Fase 1 · ' + CFG.phases[0].name : App.phase < 4 ? 'PRÓXIMA FASE ' + (App.phase + 2) + ' · ' + CFG.phases[App.phase + 1].name : 'jogar a Fase 5 de novo'; ctx.fillText((Input.isTouch() ? 'PULAR: ' : 'Espaço: ') + nx, cv.width/2, cv.height*0.57, cv.width - 24*d);
    ctx.textAlign = 'left';
  }
}

/* ===== core/GameLoop.js — passo fixo + render independente ===== */
const Q0 = new URLSearchParams(location.search), player = newPlayer();
const Game = { t: 0, started: false, done: false, over: false, endT: 0, hits: 0, cd: 0, entered: false, curS: null, banner: null, menu: !(Q0.has('fase') || Q0.has('assets') || Q0.has('seed') || Q0.has('torre') || Q0.has('teste')) };
const Players = [player]; // lista de jogadores (hoje 1; o multiplayer acrescenta os outros)
const Q = new URLSearchParams(location.search);
const App = { phase: Math.min(5, Math.max(1, +Q.get('fase') || 1)) - 1, seed: Q.get('seed'), manual: Q.get('torre') === 'manual', tower: null, color: '#e63946' };
let loadTk = 0;
function loadTower(fresh) {
  if (App.manual) { loadTk++; Game.loading = false; Level.set(ManualData); App.tower = null; return; }
  if (fresh || App.seed == null) App.seed = String(Math.floor(Math.random() * 1e9)); // única aleatoriedade: criar a seed
  Game.loading = true; const tk = ++loadTk;
  generateTowerAsync(App.seed, App.phase).then(t => { if (tk !== loadTk) return; App.tower = t; Level.set(t); Object.assign(player, newPlayer()); player.safe = null; Obstacles.reset(); Lava.reset(); Game.loading = false; first = true; });
}
loadTower(false); Object.assign(player, newPlayer());
const fmt = t => `${Math.floor(t/60)}:${(t%60).toFixed(1).padStart(4,'0')}`;
function structAt(p) { const T = App.tower; return T && T.structs ? T.structs[(Level.floorOf(p.y + p.h) - 1) >> 1] || null : null; }
function resetGame(fresh) { if (fresh) loadTower(true); Object.assign(player, newPlayer()); Game.t = 0; Game.started = false; Game.done = false; Game.over = false; Game.endT = 0; Game.hits = 0; Game.cd = 0; Game.entered = false; Game.curS = null; Game.banner = null; Lava.mult = 1; player.pushCd = 0; player.pushT = 0; player.safe = null; Obstacles.reset(); Lava.reset(); }
let last = performance.now(), acc = 0, first = true;
function frame(now) {
  const dt = Math.min((now - last) / 1000, CFG.maxFrame); last = now; acc += dt;
  while (acc >= CFG.step) {
    if (Input.pressed('debug')) debug = !debug;
    if (Input.pressed('menu') || Input.pressed('pause')) { Game.menu = !Game.menu; if (Game.menu) UI.screen = 'main'; }
    for (let i = 0; i < 5; i++) if (Input.pressed('ph' + (i + 1))) { App.phase = i; App.manual = false; Game.menu = false; resetGame(true); }
    if (Game.menu || Game.loading) { Input.endStep(); acc -= CFG.step; continue; }
    if (Input.pressed('newTower')) resetGame(true);
    else if (Game.done && Input.pressed('jump')) { App.phase = App.manual ? 0 : Math.min(4, App.phase + 1); App.manual = false; resetGame(true); } // concluiu: vai para a próxima fase
    else if (Game.over && Game.endT > .8 && Input.pressed('jump')) resetGame(true); // morreu: sempre nova seed
    else if (Game.over) Game.endT += CFG.step;
    else if (Game.cd < 3) Game.cd += CFG.step; // contagem 1, 2, 3: ninguém se mexe; o cronômetro só roda depois
    else if (!Game.done) {
      Game.cd += CFG.step; Game.started = true; Game.t += CFG.step;
      if (!Game.entered && player.x + player.w / 2 > 48) Game.entered = true; // a lava só começa a contar depois que alguém entra na torre
      Lava.mult = (structAt(player) || { mult: 1 }).mult; Lava.update(CFG.step);
      if (player.state === 'active') { stepPlayer(player, CFG.step); Obstacles.update(player, CFG.step); Combat.update(player, CFG.step); }
      const sa = structAt(player); if (Game.entered && sa && sa !== Game.curS) { Game.curS = sa; Game.banner = { n: sa.name, s: `${sa.size} · ${sa.diff}`, t: 3 }; }
      Survival.update(player, CFG.step);
      if (!Game.done && Players.every(x => x.state === 'dead')) Game.over = true; // fim: todos eliminados
      const g = Level.goal;
      if (player.state === 'active' && player.grounded && player.x < g.x+g.w && player.x+player.w > g.x && Math.abs(player.y+player.h-g.y) < 1) { Game.done = true; player.state = 'done'; }
    }
    Input.endStep(); acc -= CFG.step;
  }
  Cam.follow(player.state === 'dead' ? (Players.find(x => x.state === 'active') || player) : player, dt, first); first = false; // espectador: segue um jogador ativo
  if (Game.banner) { Game.banner.t -= dt; if (Game.banner.t <= 0) Game.banner = null; }
  render(player);
  requestAnimationFrame(frame);
}
if (Q.get('teste') === 'vida') { const el = document.createElement('pre'); el.style.cssText = 'position:fixed;inset:0;margin:0;padding:12px;background:#0b0818;color:#cfe;font:13px monospace;white-space:pre-wrap;z-index:9'; const r = Survival.selfTest(); el.textContent = 'TESTES DE SOBREVIVÊNCIA\n' + r.map(([n, o]) => (o ? 'OK   ' : 'FALHOU ') + n).join('\n'); document.body.appendChild(el); }
else if (Q.has('teste')) runTests(+Q.get('teste') || 20);
requestAnimationFrame(frame);

/* ===== modo de teste: abra index.html?teste=20 (opcional &fase=N) ===== */
function runTests(n) {
  const el = document.createElement('pre');
  el.style.cssText = 'position:fixed;inset:0;margin:0;padding:12px;background:#0b0818;color:#cfe;font:12px monospace;overflow:auto;white-space:pre-wrap;z-index:9';
  document.body.appendChild(el);
  const out = t => { el.textContent += t + '\n'; }, rows = [], hashes = {}, jobs = [];
  const phases = Q.get('fase') ? [App.phase] : [0, 1, 2, 3, 4];
  out(`TESTE DE GERAÇÃO v${GEN_VERSION} — ${n} seeds por fase. Modelos válidos: ${TEMPLATES.filter(t => t.ok).map(t => t.id).join(', ')}`);
  const bad = TEMPLATES.filter(t => !t.ok); if (bad.length) out('MODELOS REPROVADOS: ' + bad.map(t => t.id).join(', '));
  phases.forEach(ph => { for (let s = 1; s <= n; s++) jobs.push([ph, s]); });
  let k = 0;
  (function next() {
    const t0 = performance.now();
    while (k < jobs.length && performance.now() - t0 < 60) {
      const [ph, s] = jobs[k++], tw = generateTower('t' + s, ph), st = tw.stats;
      rows.push({ seed: 't' + s, fase: ph + 1, andares: tw.N, tentativas: st.attempts, falhas: st.fails, rejeitadas: st.rejected, fallback: st.fallbacks, valida: tw.valid, ms: Math.round(st.ms) });
      (hashes[ph] = hashes[ph] || new Set()).add(tw.hash);
      if (!tw.valid || st.fallbacks) out(`! fase ${ph + 1} seed t${s}: válida=${tw.valid} fallbacks=${st.fallbacks}`);
    }
    if (k < jobs.length) { setTimeout(next, 0); return; }
    phases.forEach(ph => {
      const r = rows.filter(x => x.fase === ph + 1), sum = f => r.reduce((a, x) => a + x[f], 0);
      const det = generateTower('t1', ph).hash === generateTower('t1', ph).hash;
      out(`Fase ${ph + 1} (${r[0].andares} andares): válidas ${r.filter(x => x.valida).length}/${r.length} · distintas ${hashes[ph].size}/${r.length} · determinística ${det} · fallbacks ${sum('fallback')} · tentativas ${sum('tentativas')} · falhas ${sum('falhas')} · ms médio ${Math.round(sum('ms') / r.length)}`);
    });
    console.table(rows); out('FIM (tabela completa no console)');
  })();
}
